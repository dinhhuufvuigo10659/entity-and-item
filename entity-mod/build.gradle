plugins {
    // 26.x 起游戏不再混淆，必须用非 remap 版 Loom
    id 'net.fabricmc.fabric-loom' version '1.17.14'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.x 无混淆：不需要 mappings

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 配置界面：Cloth Config（硬依赖）
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // Mod 菜单「配置」按钮：ModMenu（编译期需要，运行期可选）
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    // 开发环境带上 ModMenu，方便 `gradlew runClient` 直接验证配置页
    localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_dependency", project.minecraft_dependency
    inputs.property "loader_dependency", project.loader_dependency
    inputs.property "cloth_config_dependency", project.cloth_config_dependency

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_dependency": project.minecraft_dependency,
                "loader_dependency": project.loader_dependency,
                "cloth_config_dependency": project.cloth_config_dependency
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// 26.3 无混淆 + Java 25：Gradle 用 JDK 25 启动，编译目标也是 25。